# Gera as imagens de preview do README quando a página, a tela de instalação
# do iOS ou os ícones mudam. Só faz commit se alguma imagem mudou.

name: amostras

on:
  push:
    branches: [main]
    paths:
      - trackeroao.html
      - docs/progress.json
      - sync/ios.html
      - windows/instalador/icone/**
      - docs/celular/ios/Assets.xcassets/**
      - .github/amostras.js
      - .github/workflows/amostras.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: amostras
  cancel-in-progress: true

jobs:
  amostras:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Navegador
        run: |
          npm install --no-save --no-package-lock playwright@1.47.2
          npx playwright install --with-deps chromium
      - name: Tirar as imagens
        run: node .github/amostras.js
      - name: Guardar, se mudaram
        shell: bash
        env:
          GIT_AUTHOR_NAME: oaovito
          GIT_AUTHOR_EMAIL: oaovito@icloud.com
          GIT_COMMITTER_NAME: oaovito
          GIT_COMMITTER_EMAIL: oaovito@icloud.com
        run: |
          git add docs/amostras
          if git diff --cached --quiet; then echo "nenhuma imagem mudou"; exit 0; fi
          git commit -q -m "Imagens de preview do README"
          for i in 1 2 3; do
            git pull -q --rebase origin main && git push -q origin HEAD:main && exit 0
            sleep 5
          done
          exit 1

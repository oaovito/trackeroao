# Compila o aplicativo de iOS a cada mudança nele.

name: ios

on:
  push:
    branches: [main]
    paths:
      - 'docs/celular/ios/**'
      - '.github/workflows/ios.yml'
  workflow_dispatch:

jobs:
  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Construir o aplicativo
        run: VERSAO=0.0.0 bash docs/celular/ios/construir.sh
      - uses: actions/upload-artifact@v4
        with:
          name: trackeroao-ipa
          path: docs/celular/ios/build/trackeroao.ipa
          retention-days: 3
